name: Update Sleeper snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Sleeper snapshot
        run: node scripts/update-snapshot.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "Sleeper Snapshot Bot"
          git config user.email "actions@users.noreply.github.com"

          git add snapshot.json

          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "Update Sleeper snapshot"
            git push
          fi
